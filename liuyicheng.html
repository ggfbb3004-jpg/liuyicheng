<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>给刘奕橙</title>
<style>
  :root{
    --night:#150d26;
    --dusk:#2a1740;
    --plum:#4a2350;
    --glow:#ff8a2b;
    --peach:#ffc9a0;
    --rose:#f08aa5;
    --paper:#fff4e8;
    --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:var(--serif);
    color:var(--paper);
    background:linear-gradient(180deg,var(--night) 0%,var(--dusk) 35%,var(--plum) 70%,#7a3340 100%);
    background-attachment:scroll;
    line-height:1.9;
    overflow-x:hidden;
  }
  #sky{position:fixed;inset:0;z-index:0;pointer-events:none}
  main{position:relative;z-index:1}
  section{padding:14vh 7vw;max-width:880px;margin:0 auto}

  /* ---------- 开场 ---------- */
  .hero{
    min-height:100vh;max-width:none;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden;
  }
  .sun{
    position:absolute;left:50%;bottom:-18vmin;width:84vmin;height:84vmin;border-radius:50%;
    transform:translate(-50%,45%);
    background:radial-gradient(circle at 50% 45%,#ffb25e 0%,var(--glow) 32%,rgba(255,138,43,.35) 56%,rgba(255,138,43,0) 72%);
    filter:blur(2px);
    animation:rise 4.5s cubic-bezier(.2,.7,.2,1) .3s forwards;
  }
  @keyframes rise{to{transform:translate(-50%,-6%)}}
  .name{
    position:relative;font-size:clamp(3.6rem,17vw,9rem);font-weight:700;letter-spacing:.14em;
    padding-left:.14em;line-height:1.1;text-shadow:0 0 40px rgba(255,138,43,.55);
  }
  .name span{display:inline-block;opacity:0;transform:translateY(.35em) scale(.96);filter:blur(10px);
    animation:ink 1.8s ease forwards}
  .name span:nth-child(1){animation-delay:1.6s}
  .name span:nth-child(2){animation-delay:2.2s}
  .name span:nth-child(3){animation-delay:2.8s;color:var(--glow);text-shadow:0 0 36px rgba(255,138,43,.9)}
  @keyframes ink{to{opacity:1;transform:none;filter:blur(0)}}
  .tag{
    position:relative;margin-top:1.6rem;font-size:clamp(1rem,3.6vw,1.25rem);color:var(--peach);
    letter-spacing:.2em;opacity:0;animation:fade 2s ease 4.2s forwards;
  }
  .hint{
    position:absolute;bottom:4vh;left:50%;transform:translateX(-50%);font-size:.9rem;color:var(--peach);
    opacity:0;animation:fade 2s ease 5.2s forwards, bob 2.6s ease-in-out 6s infinite;letter-spacing:.3em;
  }
  @keyframes fade{to{opacity:.8}}
  @keyframes bob{50%{transform:translate(-50%,8px)}}

  /* ---------- 通用标题 ---------- */
  h2{font-size:clamp(1.6rem,5vw,2.3rem);font-weight:600;letter-spacing:.12em;margin-bottom:2.2rem}
  p.lead{color:var(--peach);margin-bottom:2rem;max-width:34em}

  /* ---------- 天数 ---------- */
  .counter{display:flex;flex-wrap:wrap;gap:1.2rem 2.6rem;align-items:flex-end}
  .counter div{min-width:4.5rem}
  .counter b{display:block;font-size:clamp(2.6rem,10vw,4.6rem);font-weight:700;line-height:1;
    color:var(--glow);text-shadow:0 0 28px rgba(255,138,43,.5);font-variant-numeric:tabular-nums}
  .counter small{color:var(--peach);font-size:.95rem;letter-spacing:.2em}

  /* ---------- 故事（真实的时间顺序） ---------- */
  .story{list-style:none;position:relative;margin-left:.6rem;padding-left:2.2rem;
    border-left:1px solid rgba(255,201,160,.35)}
  .story li{position:relative;margin-bottom:3rem}
  .story li::before{
    content:"";position:absolute;left:calc(-2.2rem - 6px);top:.75rem;width:11px;height:11px;border-radius:50%;
    background:var(--glow);box-shadow:0 0 0 5px rgba(255,138,43,.18),0 0 18px var(--glow);
  }
  .story time{display:block;color:var(--rose);font-size:.95rem;letter-spacing:.15em}
  .story h3{font-size:1.3rem;font-weight:600;margin:.1rem 0 .3rem}
  .story p{color:rgba(255,244,232,.82);max-width:32em}

  /* ---------- 愿望灯 ---------- */
  .wish{display:flex;gap:.8rem;flex-wrap:wrap;margin-bottom:1rem}
  .wish input{
    flex:1 1 14rem;min-width:0;padding:.85rem 1.1rem;font:inherit;color:var(--paper);
    background:rgba(255,244,232,.07);border:1px solid rgba(255,201,160,.4);border-radius:999px;outline:none;
  }
  .wish input::placeholder{color:rgba(255,201,160,.6)}
  .wish input:focus-visible,.btn:focus-visible{outline:2px solid var(--peach);outline-offset:3px}
  .btn{
    font:inherit;cursor:pointer;padding:.85rem 1.8rem;border-radius:999px;border:none;color:#2a1208;font-weight:700;
    letter-spacing:.12em;background:linear-gradient(135deg,#ffb25e,var(--glow));
    box-shadow:0 8px 30px rgba(255,138,43,.35);transition:transform .2s,box-shadow .2s;
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 12px 36px rgba(255,138,43,.5)}
  .btn:active{transform:translateY(0)}
  .lantern-field{position:fixed;inset:0;z-index:5;pointer-events:none;overflow:hidden}
  .lantern{
    position:absolute;bottom:-120px;width:58px;height:74px;border-radius:14px 14px 20px 20px / 18px 18px 26px 26px;
    background:linear-gradient(180deg,#ffd9a6,#ff9a3d 55%,#e8661c);
    box-shadow:0 0 34px 8px rgba(255,150,60,.55),inset 0 -10px 16px rgba(160,50,0,.35);
    animation:float var(--t) ease-in forwards;
  }
  .lantern::before{content:"";position:absolute;left:8px;right:8px;top:-5px;height:6px;border-radius:3px;background:#7a3a14}
  .lantern::after{content:"";position:absolute;left:50%;bottom:-16px;width:2px;height:16px;background:rgba(255,201,160,.6)}
  .lantern i{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:1.2em;
    font-style:normal;font-size:.78rem;line-height:1.15;text-align:center;color:#4a1a05;font-weight:700;
  }
  @keyframes float{
    0%{transform:translate(0,0) rotate(-2deg);opacity:0}
    8%{opacity:1}
    50%{transform:translate(var(--dx),-55vh) rotate(3deg)}
    100%{transform:translate(calc(var(--dx)*-.6),-125vh) rotate(-2deg);opacity:0}
  }

  /* ---------- 信 ---------- */
  .letter{
    margin-top:2rem;padding:clamp(1.6rem,6vw,3rem);border-radius:6px;color:#3b2218;
    background:linear-gradient(160deg,#fff7ec,#ffe6cc);
    box-shadow:0 30px 70px rgba(0,0,0,.45),0 0 60px rgba(255,138,43,.18);
    min-height:12rem;font-size:1.08rem;
  }
  .letter p{margin-bottom:1.1rem;max-width:30em}
  .letter .sign{text-align:right;margin-top:1.8rem;font-weight:600;max-width:none}
  .caret::after{content:"▍";color:var(--glow);animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  /* ---------- 结尾 ---------- */
  .end{text-align:center;padding-bottom:22vh}
  .end .big{font-size:clamp(1.8rem,7vw,3.2rem);letter-spacing:.2em;line-height:1.7;text-shadow:0 0 40px rgba(255,138,43,.5)}
  .end .big em{font-style:normal;color:var(--glow)}
  .end .small{margin-top:1.6rem;color:var(--peach);letter-spacing:.15em}
  .heart{display:inline-block;color:var(--rose);animation:beat 1.6s ease-in-out infinite}
  @keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.22)}24%{transform:scale(1)}36%{transform:scale(1.15)}}

  .reveal{opacity:0;transition:opacity 1.2s ease}
  .reveal.in{opacity:1}

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms!important;animation-delay:0s!important;transition:none!important}
    .sun{transform:translate(-50%,-6%)}
  }
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div class="lantern-field" id="lanterns" aria-hidden="true"></div>

<main>
  <header class="hero">
    <div class="sun"></div>
    <h1 class="name" aria-label="刘奕橙"><span>刘</span><span>奕</span><span>橙</span></h1>
    <p class="tag">我的人间橙光</p>
    <div class="hint">向下，有话对你说</div>
  </header>

  <section class="reveal">
    <h2>我们在一起</h2>
    <div class="counter" id="counter" aria-live="off">
      <div><b id="d">0</b><small>天</small></div>
      <div><b id="h">0</b><small>时</small></div>
      <div><b id="m">0</b><small>分</small></div>
      <div><b id="s">0</b><small>秒</small></div>
    </div>
    <p class="lead" style="margin-top:2rem">每一秒都算数，因为每一秒里都有你。</p>
  </section>

  <section class="reveal">
    <h2>我们的故事</h2>
    <ol class="story" id="story"></ol>
  </section>

  <section class="reveal">
    <h2>替你点一盏灯</h2>
    <p class="lead">写下一个愿望，它会带着光飘向夜空。想要的、想去的、想一起做的，都可以。</p>
    <div class="wish">
      <input id="wishInput" maxlength="8" placeholder="写一个愿望（最多 8 个字）" aria-label="愿望内容">
      <button class="btn" id="wishBtn" type="button">放飞</button>
    </div>
  </section>

  <section class="reveal">
    <h2>写给你的信</h2>
    <button class="btn" id="openLetter" type="button">拆开这封信</button>
    <div class="letter" id="letter" hidden></div>
  </section>

  <section class="end reveal">
    <p class="big">奕<em>橙</em>，<br>余生请多指教<span class="heart">♥</span></p>
    <p class="small" id="from"></p>
  </section>
</main>

<script>
/* =====================================================
   ✎ 这里是你要改的地方：日期、故事、信的内容、落款
   ===================================================== */
const CONFIG = {
  startDate: "2026-09-25T00:00:00",       // ← 在一起的日子（按今天 49 天推算，可自行修改）
  from: "你的名字",                        // ← 落款
  story: [
    { date: "2026 · 初秋 · 第一次见面", title: "那天，我记住了你的笑", text: "后来我总想，如果那天没有走过去，现在的世界会少多少颜色。" },
    { date: "2026 · 9 月 25 日 · 在一起", title: "从这天起，我有了你", text: "心跳声大到我怕你听见，可你什么也没说，只是握得更紧了。" },
    { date: "2026 · 十月 · 第一次一起出去", title: "路很长，有你就不累", text: "沿途的风景我已经记不清了，只记得你回头看我的样子。" },
    { date: "2026 · 11 月 · 在一起第 49 天", title: "还在继续", text: "才刚刚开始，我就已经想把往后的每一天都写成和你有关的篇章。" }
  ],
  letter: [
    "奕橙：",
    "橙子要在秋天最甜的时候才被剥开。我常觉得，你就是我遇到的那个最好的季节。",
    "你的名字里有一个“奕”字，是神采飞扬、光芒闪耀的意思。认识你以后我才明白，原来真的有人，光是站在那里就让周围亮起来。",
    "谢谢你包容我的小脾气，听我讲无聊的废话，在我失落的时候什么都不问，只是陪着我。和你在一起，平凡的日子也有了值得期待的重量。",
    "我没办法承诺天上的星星，但我可以承诺：以后的每一个黄昏，我都想和你一起看。",
    "愿你永远明亮，永远被爱，而我，刚好是那个爱你的人。"
  ],
  wishes: ["平安喜乐","一起旅行","天天开心","永远在一起","吃遍美食","白头偕老","万事胜意","岁岁年年"]
};

/* ---------- 星空 + 橙色萤火 ---------- */
(function(){
  const c = document.getElementById("sky"), x = c.getContext("2d");
  let W, H, stars = [], embers = [];
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function size(){
    const r = devicePixelRatio || 1;
    W = c.width = innerWidth * r; H = c.height = innerHeight * r;
    c.style.width = innerWidth + "px"; c.style.height = innerHeight + "px";
    stars = Array.from({length: Math.min(160, innerWidth / 6)}, () => ({
      x: Math.random() * W, y: Math.random() * H * .8, r: (Math.random() * 1.3 + .3) * r,
      p: Math.random() * 6.28, s: Math.random() * .02 + .005
    }));
    embers = Array.from({length: 38}, () => newEmber(true));
  }
  function newEmber(init){
    const r = devicePixelRatio || 1;
    return { x: Math.random() * W, y: init ? Math.random() * H : H + 20,
      r: (Math.random() * 2 + 1) * r, vy: (Math.random() * .4 + .15) * r,
      sw: Math.random() * 6.28, a: Math.random() * .5 + .3 };
  }
  function frame(){
    x.clearRect(0, 0, W, H);
    for (const s of stars){
      s.p += s.s;
      x.globalAlpha = .35 + Math.sin(s.p) * .35;
      x.fillStyle = "#fff4e8";
      x.beginPath(); x.arc(s.x, s.y, s.r, 0, 6.28); x.fill();
    }
    for (const e of embers){
      e.y -= e.vy; e.sw += .01; e.x += Math.sin(e.sw) * .35;
      if (e.y < -20) Object.assign(e, newEmber(false));
      const g = x.createRadialGradient(e.x, e.y, 0, e.x, e.y, e.r * 5);
      g.addColorStop(0, `rgba(255,170,80,${e.a})`); g.addColorStop(1, "rgba(255,138,43,0)");
      x.globalAlpha = 1; x.fillStyle = g;
      x.beginPath(); x.arc(e.x, e.y, e.r * 5, 0, 6.28); x.fill();
    }
    if (!reduce) requestAnimationFrame(frame);
  }
  addEventListener("resize", size); size(); frame();
})();

/* ---------- 在一起的时间 ---------- */
(function(){
  const start = new Date(CONFIG.startDate).getTime();
  const $ = id => document.getElementById(id);
  function tick(){
    let t = Math.max(0, Math.floor((Date.now() - start) / 1000));
    $("d").textContent = Math.floor(t / 86400);
    $("h").textContent = Math.floor(t % 86400 / 3600);
    $("m").textContent = Math.floor(t % 3600 / 60);
    $("s").textContent = t % 60;
  }
  tick(); setInterval(tick, 1000);
})();

/* ---------- 故事 ---------- */
document.getElementById("story").innerHTML = CONFIG.story.map(s =>
  `<li><time>${s.date}</time><h3>${s.title}</h3><p>${s.text}</p></li>`).join("");

/* ---------- 愿望灯 ---------- */
(function(){
  const field = document.getElementById("lanterns");
  const input = document.getElementById("wishInput");
  function release(){
    const text = (input.value.trim() || CONFIG.wishes[Math.random() * CONFIG.wishes.length | 0]).slice(0, 8);
    input.value = "";
    const el = document.createElement("div");
    el.className = "lantern";
    el.style.left = (10 + Math.random() * 78) + "vw";
    el.style.setProperty("--dx", (Math.random() * 120 - 60) + "px");
    el.style.setProperty("--t", (11 + Math.random() * 5) + "s");
    const chars = [...text];
    el.innerHTML = "<i>" + chars.slice(0, 4).join("<br>") + (chars.length > 4 ? "<br>" + chars.slice(4).join("") : "") + "</i>";
    field.appendChild(el);
    el.addEventListener("animationend", () => el.remove());
  }
  document.getElementById("wishBtn").addEventListener("click", release);
  input.addEventListener("keydown", e => { if (e.key === "Enter") release(); });
})();

/* ---------- 信（逐字出现） ---------- */
(function(){
  const btn = document.getElementById("openLetter"), box = document.getElementById("letter");
  let started = false;
  btn.addEventListener("click", async () => {
    if (started) return; started = true;
    btn.style.display = "none"; box.hidden = false;
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    for (const line of CONFIG.letter){
      const p = document.createElement("p"); box.appendChild(p); p.classList.add("caret");
      if (reduce) p.textContent = line;
      else for (const ch of line){ p.textContent += ch; await new Promise(r => setTimeout(r, 70)); }
      p.classList.remove("caret");
      await new Promise(r => setTimeout(r, reduce ? 0 : 450));
    }
    const sign = document.createElement("p");
    sign.className = "sign";
    sign.textContent = "—— 爱你的" + CONFIG.from;
    box.appendChild(sign);
  });
})();

/* ---------- 结尾落款 + 滚动显现 ---------- */
document.getElementById("from").textContent = "永远爱你的王青霖" + CONFIG.from;
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } }), {threshold:.15});
document.querySelectorAll(".reveal").forEach(el => io.observe(el));
</script>
</body>
</html>
